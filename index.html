:root{
  --ground:#ece3d3; --paper:#fbf7f0; --ink:#2e3628; --soft:#7a7464; --line:#d8ccb6; --faint:#e9e0cf;
  --leaf:#4f6a47; --leaf-soft:#dfe6d3; --leaf-deep:#3c5236; --sand:#c9b48f;
  --hand:"Caveat","Segoe Print",cursive; --body:"Nunito","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--ground);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;margin:0 auto;max-width:980px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1;margin:0;color:var(--leaf-deep)}
.tabs{display:flex;background:var(--faint);border-radius:999px;padding:3px}
.tab{padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--soft)}
.tab[aria-selected=true]{background:var(--paper);color:var(--leaf-deep);box-shadow:0 1px 2px rgba(60,82,54,.15)}

.wrap{max-width:980px;margin:0 auto}

/* date strip */
.datebar{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.nav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:20px;color:var(--leaf-deep);flex:none}
.when{flex:1;min-width:0;text-align:center}
.when b{display:block;font-family:var(--hand);font-size:30px;line-height:1.05;color:var(--ink)}
.when label{font-size:14px;color:var(--soft);display:inline-flex;align-items:center;gap:6px}
.when input{border:0;background:transparent;color:var(--soft);font-size:14px;padding:0}

/* cards */
.grid{display:grid;gap:14px}
@media (min-width:760px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.col{display:grid;gap:14px}}
@media (max-width:759px){.col{display:contents}}
.card{background:var(--paper);border-radius:14px;padding:14px 16px 16px;border:1px solid var(--faint)}
.card h2{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1;margin:0 0 8px;color:var(--leaf-deep);text-align:center}
.must{border:1.5px solid var(--leaf);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--leaf-soft)}

.row{display:flex;align-items:flex-start;gap:10px}
.chk{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--leaf);flex:none;display:grid;place-items:center;margin-top:7px;background:var(--paper)}
.chk svg{width:14px;height:14px;opacity:0;color:var(--paper)}
.chk[aria-pressed=true]{background:var(--leaf)}
.chk[aria-pressed=true] svg{opacity:1}
.row.done .ln,.row.done .two{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--sand)}

.ln{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px 5px;border-radius:0}
.ln:focus,.two:focus,.lined:focus,.review:focus{outline:none;border-color:var(--leaf)}
.two{flex:1;min-width:0;height:72px;border:0;resize:none;overflow:hidden;background:transparent;line-height:36px;padding:0 2px;
  background:linear-gradient(var(--line),var(--line)) 0 35px/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 71px/100% 1px no-repeat}
#todo{display:grid;gap:8px}
#must{display:grid;gap:2px;padding-bottom:4px}

.lined{width:100%;border:0;resize:vertical;background:transparent;line-height:36px;padding:0 2px;min-height:144px;
  background-image:linear-gradient(to bottom,transparent 35px,var(--line) 35px);background-size:100% 36px;background-attachment:local}
.quote .lined{min-height:108px}

/* cups */
.cups{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.cup{width:32px;height:42px}
.cup svg{width:100%;height:100%;display:block}
.cup .glass{fill:none;stroke:var(--leaf-deep);stroke-width:1.2;stroke-linejoin:round}
.cup .water{fill:var(--leaf);opacity:0;transition:opacity .15s}
.cup[aria-pressed=true] .water{opacity:.85}
.count{text-align:center;color:var(--soft);font-size:13px;margin-top:6px}

/* stars */
.stars{display:flex;justify-content:center;gap:8px}
.star{width:36px;height:36px}
.star svg{width:100%;height:100%}
.star path{fill:transparent;stroke:var(--leaf);stroke-width:1.4;stroke-linejoin:round;transition:fill .15s}
.star.on path{fill:var(--leaf)}

.review{width:100%;min-height:260px;border:0;resize:vertical;background-color:transparent;line-height:20px;padding:4px 4px;
  background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);background-size:20px 20px;background-attachment:local}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--ground) 70%,transparent);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.save{background:var(--leaf);color:var(--paper);font-weight:700;border-radius:999px;padding:13px 34px;font-size:16px;box-shadow:0 4px 14px rgba(60,82,54,.25)}
.save:active{background:var(--leaf-deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14px;z-index:7}

/* past days */
.list{display:grid;gap:10px}
.day{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--faint);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.day .d{width:48px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.day .d b{display:block;font-family:var(--hand);font-size:30px;line-height:1;color:var(--leaf-deep)}
.day .d span{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.day .t{flex:1;min-width:0}
.day .t strong{display:block;font-weight:600}
.day .t em{display:block;font-style:normal;color:var(--soft);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:2px;flex:none}
.mini svg{width:15px;height:15px}
.mini path{fill:transparent;stroke:var(--leaf);stroke-width:1.6}
.mini .on path{fill:var(--leaf)}
.month{font-family:var(--hand);font-size:24px;color:var(--soft);margin:10px 2px 0}
.empty{text-align:center;color:var(--soft);padding:40px 16px}
.empty b{display:block;font-family:var(--hand);font-size:28px;color:var(--leaf-deep);font-weight:700}

.backup{margin-top:22px}
.backup p{color:var(--soft);font-size:14px;margin:0 0 10px;text-align:center}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ghost{border:1.5px solid var(--leaf);color:var(--leaf-deep);border-radius:999px;padding:9px 18px;font-weight:600;background:var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Daily Planner</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabToday" aria-selected="true" type="button">Today</button>
      <button class="tab" role="tab" id="tabPast" aria-selected="false" type="button">Past days</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="viewDay">
    <div class="datebar">
      <button class="nav" id="prev" type="button" aria-label="Previous day">&#8249;</button>
      <div class="when">
        <b id="dayname">Thursday</b>
        <label for="date"><input type="date" id="date"></label>
      </div>
      <button class="nav" id="next" type="button" aria-label="Next day">&#8250;</button>
    </div>

    <div class="grid">
      <div class="col">
        <div class="card must"><h2>Must Be Done Today</h2><div id="must"></div></div>
        <div class="card"><h2>To Do List</h2><div id="todo"></div></div>
        <div class="card quote"><h2>Quote of the Day</h2><textarea class="lined" id="quote" data-k="quote" aria-label="Quote of the day"></textarea></div>
      </div>
      <div class="col">
        <div class="card"><h2>Water Cups</h2><div class="cups" id="cups"></div><div class="count" id="count">0 of 8</div></div>
        <div class="card"><h2>Things I'm Grateful For</h2><textarea class="lined" id="grateful" data-k="grateful" aria-label="Things I'm grateful for"></textarea></div>
        <div class="card"><h2>Rate Your Day</h2><div class="stars" id="stars" role="group" aria-label="Rate your day"></div></div>
        <div class="card"><h2>My Day</h2><textarea class="review" id="review" data-k="review" aria-label="Notes about my day"></textarea></div>
      </div>
    </div>
  </section>

  <section id="viewPast" hidden>
    <div class="list" id="list"></div>
    <div class="card backup">
      <h2>Backup</h2>
      <p>Your days live on this phone only. Save a backup file now and then, and keep it somewhere safe.</p>
      <div class="btns">
        <button class="ghost" id="export" type="button">Download backup</button>
        <button class="ghost" id="importBtn" type="button">Restore from backup</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar"><button class="save" id="save" type="button">Save day</button></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const PREFIX="planner:";
  const tick='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.6 5.3 4 7.6 8.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const starP='M12 3.2l2.6 5.6 6.1.7-4.5 4.2 1.2 6.1L12 16.8l-5.4 3 1.2-6.1-4.5-4.2 6.1-.7z';
  const star=c=>'<svg viewBox="0 0 24 24" aria-hidden="true"'+(c?' class="'+c+'"':'')+'><path d="'+starP+'"/></svg>';
  const cup='<svg viewBox="0 0 20 26" aria-hidden="true"><path class="water" d="M4.3 11.5 H15.7 L14.7 22.3 Q14.5 23.6 13.2 23.6 H6.8 Q5.5 23.6 5.3 22.3 Z"/><path class="glass" d="M2.7 2.4 H17.3 L15.5 22.6 Q15.3 24.4 13.4 24.4 H6.6 Q4.7 24.4 4.5 22.6 Z"/></svg>';

  // build the page pieces
  for(let i=0;i<3;i++){const r=document.createElement("div");r.className="row";
    r.innerHTML='<button type="button" class="chk" aria-pressed="false" data-c="pc'+i+'" aria-label="Mark done">'+tick+'</button><input class="ln" data-k="p'+i+'" aria-label="Must do '+(i+1)+'">';$("must").appendChild(r);}
  for(let i=0;i<6;i++){const r=document.createElement("div");r.className="row";
    r.innerHTML='<button type="button" class="chk" aria-pressed="false" data-c="tc'+i+'" aria-label="Mark done">'+tick+'</button><textarea class="two" rows="2" data-k="t'+i+'" aria-label="Task '+(i+1)+'"></textarea>';$("todo").appendChild(r);}
  for(let i=0;i<8;i++){const b=document.createElement("button");b.type="button";b.className="cup";b.dataset.c="w"+i;b.setAttribute("aria-pressed","false");b.setAttribute("aria-label","Cup "+(i+1));b.innerHTML=cup;$("cups").appendChild(b);}
  for(let i=1;i<=5;i++){const b=document.createElement("button");b.type="button";b.className="star";b.dataset.v=i;b.setAttribute("aria-label",i+" of 5");b.innerHTML=star();$("stars").appendChild(b);}

  // storage helpers
  const store={
    get(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
    keys(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(PREFIX)===0)out.push(k);}}catch(e){}return out;}
  };
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

  const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
  const fromIso=s=>new Date(s+"T12:00");
  const dateInput=$("date");
  dateInput.value=iso(new Date());
  let data={},dirty=false;

  function hasContent(d){return d&&Object.keys(d).some(k=>k!=="savedAt"&&d[k]);}
  function load(){
    data=store.get(PREFIX+dateInput.value)||{};
    $("dayname").textContent=fromIso(dateInput.value).toLocaleDateString("en-US",{weekday:"long"});
    document.querySelectorAll("[data-k]").forEach(el=>{el.value=data[el.dataset.k]||"";});
    document.querySelectorAll("[data-c]").forEach(el=>{const on=!!data[el.dataset.c];el.setAttribute("aria-pressed",on);const r=el.closest(".row");if(r)r.classList.toggle("done",on);});
    paintStars();paintCount();dirty=false;
  }
  function persist(){
    if(!hasContent(data)){try{localStorage.removeItem(PREFIX+dateInput.value);}catch(e){}return true;}
    data.savedAt=new Date().toISOString();
    return store.set(PREFIX+dateInput.value,data);
  }
  let autoT;
  function changed(){dirty=true;clearTimeout(autoT);autoT=setTimeout(()=>{persist();dirty=false;},800);}
  function paintStars(){const v=data.stars||0;$("stars").querySelectorAll(".star").forEach(s=>{const on=+s.dataset.v<=v;s.classList.toggle("on",on);s.setAttribute("aria-pressed",on);});}
  function paintCount(){let n=0;for(let i=0;i<8;i++)if(data["w"+i])n++;$("count").textContent=n+" of 8";}

  document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){data[k]=e.target.value;changed();}});
  document.addEventListener("click",e=>{
    const c=e.target.closest("[data-c]");
    if(c){const on=c.getAttribute("aria-pressed")!=="true";c.setAttribute("aria-pressed",on);data[c.dataset.c]=on;const r=c.closest(".row");if(r)r.classList.toggle("done",on);paintCount();changed();return;}
    const s=e.target.closest(".star");
    if(s){const v=+s.dataset.v;data.stars=data.stars===v?0:v;paintStars();changed();}
  });

  function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,1800);}
  $("save").onclick=()=>{clearTimeout(autoT);const ok=persist();dirty=false;toast(ok?(hasContent(data)?"Day saved":"Nothing to save yet"):"Could not save on this phone");};

  function go(iso2){clearTimeout(autoT);if(dirty)persist();dateInput.value=iso2;load();window.scrollTo(0,0);}
  $("prev").onclick=()=>{const d=fromIso(dateInput.value);d.setDate(d.getDate()-1);go(iso(d));};
  $("next").onclick=()=>{const d=fromIso(dateInput.value);d.setDate(d.getDate()+1);go(iso(d));};
  dateInput.addEventListener("change",()=>{if(dateInput.value)go(dateInput.value);});

  // tabs
  function show(which){
    const past=which==="past";
    $("viewDay").hidden=past;$("viewPast").hidden=!past;$("savebar").hidden=past;
    $("tabToday").setAttribute("aria-selected",!past);$("tabPast").setAttribute("aria-selected",past);
    if(past){if(dirty){clearTimeout(autoT);persist();dirty=false;}renderList();}
    window.scrollTo(0,0);
  }
  $("tabToday").onclick=()=>show("day");
  $("tabPast").onclick=()=>show("past");

  function renderList(){
    const list=$("list");list.innerHTML="";
    const days=store.keys().map(k=>({iso:k.slice(PREFIX.length),d:store.get(k)})).filter(x=>hasContent(x.d)).sort((a,b)=>a.iso<b.iso?1:-1);
    if(!days.length){list.innerHTML='<div class="empty"><b>No saved days yet</b>Fill in today and tap Save day. It will show up here.</div>';return;}
    let lastMonth="";
    days.forEach(x=>{
      const dt=fromIso(x.iso),m=dt.toLocaleDateString("en-US",{month:"long",year:"numeric"});
      if(m!==lastMonth){const h=document.createElement("div");h.className="month";h.textContent=m;list.appendChild(h);lastMonth=m;}
      const preview=x.d.p0||x.d.t0||x.d.quote||x.d.grateful||"";
      let stars="";for(let i=1;i<=5;i++)stars+=star(i<=(x.d.stars||0)?"on":"");
      const b=document.createElement("button");b.type="button";b.className="day";
      b.innerHTML='<div class="d"><b>'+dt.getDate()+'</b><span>'+dt.toLocaleDateString("en-US",{weekday:"short"})+'</span></div>'+
        '<div class="t"><strong></strong><em></em></div><div class="mini" aria-label="'+(x.d.stars||0)+' of 5 stars">'+stars+'</div>';
      b.querySelector("strong").textContent=dt.toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"short"});
      b.querySelector("em").textContent=preview.split("\n")[0]||"No notes";
      b.onclick=()=>{show("day");go(x.iso);};
      list.appendChild(b);
    });
  }

  // backup
  $("export").onclick=()=>{
    const all={};store.keys().forEach(k=>{all[k]=store.get(k);});
    const blob=new Blob([JSON.stringify({app:"daily-planner",version:1,exported:new Date().toISOString(),days:all},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="planner-backup-"+iso(new Date())+".json";document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("Backup downloaded");
  };
  $("importBtn").onclick=()=>$("importFile").click();
  $("importFile").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{const j=JSON.parse(r.result);const days=j.days||{};let n=0;
        Object.keys(days).forEach(k=>{if(k.indexOf(PREFIX)===0&&days[k]){store.set(k,days[k]);n++;}});
        renderList();load();toast(n?("Restored "+n+" days"):"No days found in that file");
      }catch(err){toast("That file is not a planner backup");}
      e.target.value="";
    };
    r.readAsText(f);
  };

  window.addEventListener("pagehide",()=>{if(dirty)persist();});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&dirty){persist();dirty=false;}});
  load();

  // offline support when installed from its own site
  if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.host)){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
